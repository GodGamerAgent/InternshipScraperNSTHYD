# Source seeds and matching rules. Consumed by collectors (Phase 3–4) — never hardcode these in Python.
# Regexes are Python `re` syntax, matched case-insensitively. Use single quotes so backslashes survive.

internship:
  # A posting is an internship if its TITLE matches an include pattern, or its ATS employment-type /
  # commitment / department field says intern(ship) — and the title matches no exclude pattern.
  # Descriptions are deliberately NOT used: full-time JDs often say "mentor our interns".
  include_patterns:
    - '\bintern\b'
    - '\binternship\b'
    - '\bsummer intern'
    - '\bwinter intern'
    - '\b6[- ]?months?\b'
    - '\bPPO\b'
    - '\bpre[- ]placement offer\b'
    - '\bapprentice(ship)?\b'
    - '\btrainee\b'
    - '\bco-?op\b'
    - '\bstudent\b'
    - '\bfellow(ship)?\b'
    - '\bcampus\b'
    - '\bfresher\b'
  # Seniority / contract markers. "Manager" and "Lead" are NOT excluded on purpose:
  # "Product Manager Intern" and "Lead Generation Intern" are real internship titles.
  exclude_title_patterns:
    - '\bsenior\b'
    - '\bsr\.?\b'
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\bdirector\b'
    - '\bhead of\b'
    - '\bvp\b'
    - '\bcontract(ual|or)?\b'
  # Employment-type values (Lever commitment, Ashby employmentType, Workable employment_type,
  # Greenhouse department names) that mark a posting as an internship.
  employment_type_patterns:
    - '\bintern(ship)?s?\b'
    - '\btrainee\b'
    - '\bapprentice(ship)?\b'

