# ---------------------------------------------------------------- Tier 2: feeds & directories
# Funding news (RSS). Titles like "GIVA raises Rs 90 Cr from BlackSoil" become StartupLeads.
funding_feeds:
  - name: inc42
    url: 'https://inc42.com/buzz/feed/'       # funding headlines ("XEBO.ai Bags $10.5 Mn …")
  - name: inc42
    url: 'https://inc42.com/startups/feed/'   # startup stories; funding titles are rare here
  - name: entrackr
    url: 'https://entrackr.com/rss'   # /feed returns 404 (verified 2026-11-26)

# Incubator directories. kind=tablepress: server-rendered TablePress tables (Lab 32);
# kind=webflow: JS-rendered Webflow list (needs FIRECRAWL_API_KEY, otherwise reported as an issue).
# default_city applies only when a row has no Headquarters value.
incubators:
  - name: thub_lab32
    kind: tablepress
    url: 'https://programs.t-hub.co/lab-32-directory/'
    default_city: hyderabad
  - name: thub
    kind: webflow
    url: 'https://www.t-hub.co/startups-directory'
    default_city: hyderabad
  # v0.2 (ADR 008). default_city applies only when a row has no more specific location.
  - name: iitm_incubation
    kind: iitm_api                # public JSON API of the portfolio page (robots respected); 425 rows
    url: 'https://incubation.iitm.ac.in/api/portfolios/active'
    default_city: chennai
    page_size: 100
    max_pages: 10
  - name: nsrcel
    kind: nsrcel_popup            # Elementor "*-startup-popup" blocks (robots respected)
    url: 'https://nsrcel.org/portfolio/'
    default_city: bengaluru

# Remote job feeds (ADR 010): keep only internships open to India (India / IST / worldwide remote).
remote_feeds:
  himalayas:
    # Documented keyless JSON API (himalayas.app/api), robots.txt respected. Page 1 of each query only:
    # `?page=` is disallowed by robots.txt. API terms: link applicationLink unchanged, credit Himalayas.
    search_url: 'https://himalayas.app/jobs/api/search'
    queries:
      - {country: IN, employment_type: Intern, sort: recent}
      - {worldwide: 'true', employment_type: Intern, sort: recent}
  remotive:
    # RSS (robots-allowed). Remotive's JSON API (/api/*) is robots-disallowed -> not used.
    feed_url: 'https://remotive.com/remote-jobs/feed'
  india_country_names: [India]
  india_utc_offset: 5.5
  worldwide_keywords: [worldwide, anywhere, global, 'any timezone', 'all timezones']
  keep_worldwide: true

# Indian student portals (ADR 011). The owner chose to collect from portals with unauthenticated public
# listings, even though their Terms prohibit automated access (see the ADR). robots.txt is respected,
# with polite per-host pacing and no login, CAPTCHA or firewall bypass.
# Non-targets: Unstop (CloudFront 403 for our UA), Cuvette (cuvette.tech does not resolve).
# Target keys are india_geo.yaml city slugs or `remote`. `--cities` narrows the city keys; remote is always kept.
student_portals:
  internshala:
    base_url: 'https://internshala.com'
    max_pages: 2                    # 50 cards per page; /page-N/ allowed by robots.txt
    targets:
      bengaluru: /internships/internship-in-bangalore/
      hyderabad: /internships/internship-in-hyderabad/
      chennai: /internships/internship-in-chennai/
      remote: /internships/work-from-home-internships/
  cutshort:
    base_url: 'https://cutshort.io'
    targets:                        # listing pages taken from cutshort.io/sitemap_listings.xml; page 1 each
      bengaluru: /jobs/startup-jobs-in-bangalore-bengaluru
      hyderabad: /jobs/startup-jobs-in-hyderabad
      chennai: /jobs/startup-jobs-in-chennai
      remote: /jobs/remote-jobs
  instahyre:
    landing_url: 'https://www.instahyre.com/internship-jobs/'   # embeds the first 20 + a `next` API link
    max_pages: 5

# Y Combinator India directory (ADR 008): server-rendered pages, robots.txt allows them.
# api.ycombinator.com is robots-disallowed and must not be used. Hiring = listed on hiring_url.
yc_india:
  listing_url: 'https://www.ycombinator.com/companies/location/india'
  hiring_url: 'https://www.ycombinator.com/companies/location/india/hiring'
  max_pages: 10
  statuses: [Active, Public]

hacker_news:
  search_url: 'https://hn.algolia.com/api/v1/search_by_date'
  comments_url: 'https://hn.algolia.com/api/v1/search'
  who_is_hiring_author: whoishiring
  story_title_pattern: '^Ask HN: Who is hiring\?'
  max_comments: 1000
  # Keep a posting when the geo resolver places it in India / Remote-India, or when it is a
  # remote role open worldwide (one of remote_global_keywords).
  remote_global_keywords: [worldwide, global, anywhere, 'any timezone', 'all timezones']
  role_keywords: ['\bintern(ship)?s?\b', '\bjunior\b', '\bnew[- ]grads?\b', '\bfreshers?\b', '\bentry[- ]level\b', '\bgraduate\b']
  # Job-SEEKER posts sometimes land in the hiring thread. They describe individuals and must be
  # skipped (never stored).
  seeker_patterns:
    - 'willing to relocate'
    - '^\s*seeking\b'
    - '\b(r[ée]sum[ée]|cv)\s*:'
    - '^\s*location\s*:.*\n?.*\bremote\s*:'

# Hosts that are never a startup's own website (job boards, registries, social, link shorteners).
# Used when picking a company domain from HN posts and incubator directory rows.
non_company_hosts: [news.ycombinator.com, ycombinator.com, linkedin.com, github.com, twitter.com, x.com,
                    facebook.com, instagram.com, youtube.com, medium.com, linktr.ee, wa.me, google.com,
                    play.google.com, apps.apple.com, jobs.lever.co, boards.greenhouse.io,
                    job-boards.greenhouse.io, jobs.ashbyhq.com, apply.workable.com, wellfound.com,
                    angel.co, notion.site, docs.google.com, forms.gle, calendly.com, bit.ly,
                    zaubacorp.com, tofler.in, crunchbase.com, tracxn.com, t-hub.co]

# ---------------------------------------------------------------- Hidden-opportunity discovery
site:
  # Paths probed on a startup's own domain (robots.txt respected).
  careers_paths: [/, /careers, /jobs, /join, /join-us, /work-with-us, /about, /contact, /team]
  max_pages: 9
  # A 200 page with less visible text than this AND an SPA mount point is treated as JS-only.
  spa_min_text_chars: 400

cold_pitch_phrases:
  - general application
  - drop your resume
  - drop us your resume
  - send your resume
  - send us your cv
  - don't see a role
  - dont see a role
  - don't see the right role
  - always looking for
  - always hiring
  - write to us
  - reach out to us

contacts:
  # Role mailboxes considered public recruiting contacts (Pass 1).
  hiring_mailbox_prefixes: [founders, founder, careers, jobs, hiring, talent, hello, hr, people,
                            recruitment, recruiting, team, internships, contact, info]
  # Company-domain mailboxes that are public but not for recruiting -> never stored.
  excluded_mailbox_prefixes: [press, media, pr, support, help, sales, billing, invoices, accounts,
                              legal, privacy, abuse, security, noreply, no-reply, donotreply, webmaster]
  # Public profile hosts we may record as URLs (we never log in or scrape these sites).
  profile_hosts: [github.com, linkedin.com, x.com, twitter.com]
  # Pass 3 work-email patterns from public founder names (only kept if the domain has MX records).
  pattern_templates: ['{first}', '{first}.{last}']
  # Pass 2: at most this many public GitHub org members are looked up (API budget).
  max_github_members: 5

# ---------------------------------------------------------------- Automatic ATS seed discovery (ADR 007)
# Automated runs only READ this file; every discovered board is stored in SQLite (`startups`).
ats_probe:
  # During `enrich`: if a startup has no ATS and its careers pages embed none, guess board slugs from
  # its domain/name and verify them on the public ATS JSON APIs (anti-collision checked).
  enabled: true
  providers: [greenhouse, lever, ashby, workable, rippling, breezyhr, recruitee]
  min_slug_length: 4          # shorter candidates collide with unrelated companies' boards
  max_candidates: 3
  strip_prefixes: [get, try, use, join, hey, go, the, my]
  stopwords: [jobs, careers, career, hiring, india, tech, labs, team, work, home, apply, startup,
              company, group, global, solutions, technologies, software, systems, digital, online, app]
  # Words ignored when comparing an ATS board's display name with the startup's name.
  # Matching is exact after removing these, so "Atlan Travel Group" never matches "Atlan".
  name_noise: [careers, career, jobs, hiring, team, inc, pvt, ltd, private, limited, llp,
               technologies, technology, labs, india, software, solutions, services, systems]

ats_search:
  # `scraper discover`: find public ATS boards through an official search API (Firecrawl /search or
  # Brave Search API; never scraping a search engine's HTML), verify each on the ATS JSON API.
  max_results_per_query: 10
  default_cities: [bengaluru, hyderabad, chennai]
  include_india_query: true   # also run each template with "India"
  queries:
    greenhouse: ['site:job-boards.greenhouse.io intern {city}', 'site:boards.greenhouse.io intern {city}']
    lever: ['site:jobs.lever.co intern {city}']
    ashby: ['site:jobs.ashbyhq.com intern {city}']
    workable: ['site:apply.workable.com intern {city}']
    rippling: ['site:ats.rippling.com intern {city}']
    breezyhr: ['site:breezy.hr intern {city}']
    recruitee: ['site:recruitee.com intern {city}']
