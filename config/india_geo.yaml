# Indian states without a single dominant startup city. A match sets country=IN and `state`
# but leaves the city unresolved so the HQ fallback (PIN / source default) can still run.
states:
  Maharashtra: [Maharashtra]
  Haryana: [Haryana]
  Uttar Pradesh: [Uttar Pradesh]
  Gujarat: [Gujarat]
  Kerala: [Kerala, Kochi, Cochin, Thiruvananthapuram, Trivandrum]
  Rajasthan: [Rajasthan, Jaipur]
  Madhya Pradesh: [Madhya Pradesh, Indore, Bhopal]
  Odisha: [Odisha, Bhubaneswar]
  Andhra Pradesh: [Andhra Pradesh, Visakhapatnam, Vizag, Vijayawada]
  Punjab: [Punjab, Mohali]
  Chandigarh: [Chandigarh]
  Goa: [Goa]
# (Telangana, Karnataka, Tamil Nadu, West Bengal live in their city's `state_aliases`.)

# Phrases removed BEFORE city matching (e.g. IANA timezone "Asia/Kolkata" is not a Kolkata job).
ignore_phrases:
  - Asia/Kolkata
  - Asia/Calcutta

# Signals that a location is in India even without a city.
india_markers: [India, Indian, Bharat, IST, GMT+5:30, UTC+5:30, GMT+05:30, UTC+05:30, Asia/Kolkata]

# Remote detection.
remote_tokens:
  - Remote
  - Fully Remote
  - Work from Home
  - WFH
  - Anywhere
  - Distributed
  - Telecommute
  - Home Based
# Phrases that are Remote-India by themselves (no separate India marker needed).
remote_india_phrases:
  - Remote India
  - India Remote
  - Remote in India
  - Remote within India
  - Remote IST
  - IST Remote
  - Work from Home India
  - WFH
  - Anywhere in India
  - Pan India
  - PAN-India

hybrid_phrases: [Hybrid, Partially Remote, Partly Remote, Remote Hybrid]
onsite_phrases: [Onsite, On-site, On Site, In Office, In-Office, Work from Office, WFO, Office Based]

# Non-India signals -> country GLOBAL (and remote_global if a remote token is also present).
