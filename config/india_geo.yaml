# India geolocation rules consumed by src/enrichment/geo.py (GeoResolver).
#
# Matching is case-insensitive and punctuation-insensitive: every term and every input string is
# lowercased and non-alphanumerics become single spaces, so "Hi-Tech City", "HITEC City" and
# "hi tech city" all normalize consistently. Terms are matched on whole words, longest first.
#
# Per city:
#   aliases        names / old spellings / airport codes        -> resolution_method "alias"
#   neighborhoods  tech-hub localities                          -> resolution_method "neighborhood"
#   state_aliases  weak signals used ONLY if nothing else hit   -> resolution_method "state_alias"
#   state_overrides  {state: [terms]} for metro areas spanning states (Delhi NCR)
#   pin_prefixes   leading digits of 6-digit PIN codes (longest prefix wins)
#   lat / lng      city centroid (WGS84), used for radius queries
#
# Adding a city needs no code change. Loading fails loudly if one term maps to two cities.

cities:
  hyderabad:
    display_name: Hyderabad
    state: Telangana
    lat: 17.3850
    lng: 78.4867
    aliases: [Hyderabad, HYD, Secunderabad, Cyberabad]
