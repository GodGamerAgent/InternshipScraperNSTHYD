[project]
name = "india-internship-scraper"
version = "0.1.0"
description = "India-optimized startup internship & hidden-opportunity scraper with city-level geolocation filtering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dnspython>=2.9.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "sqlmodel>=0.0.50",
    "typer>=0.29.2",
]

[project.scripts]
scraper = "src.cli:app"

[project.optional-dependencies]
ui = [
    "nicegui>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package is literally `src` (see docs/ADRs/001-stack-and-storage.md).
packages = ["src"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "exports"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
    "DTZ",  # naive datetimes are bugs
    "PT",   # pytest style
]
ignore = [
    "RUF001",  # allow ₹ and other unicode in strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options via call defaults; they are evaluated once and immutable.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "network: test touches the real network (never run in CI; Phase 1 has none)",
]
